name: macOS Release

# Only maintainer-selected refs reach the Mac holding the signing identity.
# Pull request builds run in test.yml on GitHub-hosted machines.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release for the existing vX.Y.Z tag
        type: boolean
        default: false

concurrency:
  group: batecho-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      BATECHO_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
      BATECHO_NOTARY_PROFILE: ${{ vars.MACOS_NOTARY_PROFILE || 'batecho-notary' }}
      BATECHO_NOTARY_KEYCHAIN: ${{ vars.MACOS_NOTARY_KEYCHAIN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version and release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)
          if [[ "$EVENT_NAME" == push && "$REF_NAME" != "v$version" ]]; then
            echo 'Tag and Info.plist version must agree.' >&2
            exit 1
          fi
          if [[ "$PUBLISH" == true ]]; then
            test "$(git rev-parse "v${version}^{commit}")" = "$(git rev-parse HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "BATECHO_EXPECTED_VERSION=$version" >> "$GITHUB_ENV"
      - name: Check signing and notary credentials before building
        run: scripts/release.sh --preflight
      - name: Test Swift pipeline
        run: make test
      - name: Build, sign, notarize and verify the downloadable ZIP
        run: scripts/release.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: BatEcho-${{ steps.version.outputs.version }}-macos-arm64
          path: |
            dist/BatEcho-${{ steps.version.outputs.version }}-macos-arm64.zip
            dist/SHA256SUMS
            dist/build-info.txt
            dist/notarization.json
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ github.event_name == 'push' || inputs.publish }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: BatEcho-${{ needs.package.outputs.version }}-macos-arm64
          path: dist
      - name: Publish the verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          printf 'BatEcho %s for Apple silicon, macOS 14 or later.\n\nDeveloper ID signed and notarized. Extract the ZIP and move BatEcho.app to Applications. The speech model downloads on first setup.\n' "$VERSION" > release-notes.md
          gh release create "v$VERSION" --verify-tag --title "BatEcho $VERSION" \
            --notes-file release-notes.md \
            "dist/BatEcho-${VERSION}-macos-arm64.zip" dist/SHA256SUMS dist/build-info.txt
